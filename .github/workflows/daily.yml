# 方案 B（零服务器）：每天定时采集 → 导出 JSON → 构建 → 部署 GitHub Pages
# 启用步骤：
#   1. 把仓库推到 GitHub（代码已含本 workflow 与 export 静态导出）
#   2. 仓库 Settings → Pages → Source 选 "GitHub Actions"（或本 workflow 使用 gh-pages 分支，二选一）
#   3. 推送后手动触发一次 Actions（Run workflow）验证
# 前端在 API 不可达时自动降级读取 /data/*.json（见 web/src/lib/api.ts）
name: daily-data-site

on:
  schedule:
    - cron: '35 11 * * 1-5' # 每天 19:35 北京时间（交易日）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: 采集数据（全量幂等）并导出静态 JSON
        run: |
          python -m invref.scripts.daily_update
          python -m invref.scripts.backfill_median --years 2 --threads 10
          python -m invref.scripts.export_static

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          force_orphan: true
