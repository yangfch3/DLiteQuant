# 临时：验证 NBS 接口在 CI 可达性（用完即删）
name: tmp-nbs-probe

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: 安装依赖
        run: uv sync --frozen
      - name: 探测 NBS
        run: uv run python -m invref.scripts.tmp_stats_ci
