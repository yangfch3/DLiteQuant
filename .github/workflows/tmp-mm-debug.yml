# 临时诊断：macromicro 源在 CI 失败原因（用完即删，勿用于生产）
name: tmp-mm-debug

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: 安装 Python 依赖（按 uv.lock）
        run: uv sync --frozen

      - name: 运行 macromicro 诊断
        run: uv run python -m invref.scripts.tmp_mm_debug
